name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Reject local production material
        shell: bash
        run: |
          disallowed_files="$({
            git ls-files 'productions/**' | grep -v '^productions/\.gitkeep$' || true
            git ls-files 'video-renderer/public/jobs/**'
            git ls-files 'client-assets/locations/**'
            git ls-files 'client-assets/inbox/**' | grep -v '^client-assets/inbox/README\.md$' || true
          } | sed '/^$/d')"

          if [[ -n "$disallowed_files" ]]; then
            echo "Local production material must not be tracked:"
            echo "$disallowed_files"
            exit 1
          fi

  verify-system:
    name: Verify system
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-renderer
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: video-renderer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install media validation tools
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Lint and type-check
        run: npm run lint

      - name: Run production script tests
        run: node --test ../production/scripts/*.test.mjs

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Bundle Remotion compositions
        run: npm run build
